[package]
name = "server-power-monitor"
version = "0.2.0"
edition = "2021"
authors = ["Taoshan"]
description = "Real-time server power & telemetry monitoring tool written in Rust with Telegram integration"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4" }
anyhow = "1.0"
